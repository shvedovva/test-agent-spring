<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List API</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Todo List API</h1>
        
        <div class="form-section">
            <h2>Создать задачу</h2>
            <form id="createForm">
                <input type="text" id="title" placeholder="Название задачи" required>
                <textarea id="description" placeholder="Описание" rows="3"></textarea>
                <button type="submit">Добавить</button>
            </form>
        </div>
        
        <div class="filters">
            <button onclick="filterTodos('all')">Все</button>
            <button onclick="filterTodos('PENDING')">В ожидании</button>
            <button onclick="filterTodos('IN_PROGRESS')">В процессе</button>
            <button onclick="filterTodos('COMPLETED')">Выполнены</button>
        </div>
        
        <div id="todosList" class="todos-list">
            <p>Загрузка...</p>
        </div>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
